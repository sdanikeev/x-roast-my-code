# Dev overrides with hot reload. Always used together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build     (= make dev)
services:
  backend:
    build:
      target: dev
    command: npm run start:dev -w backend
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules # keep the image's linux deps, hide host (macOS) ones
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  frontend:
    build:
      target: dev
    command: npm run dev -w frontend -- --hostname 0.0.0.0
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:4000
      WATCHPACK_POLLING: "true" # file events are unreliable on bind mounts (macOS/Windows)
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/frontend/.next
